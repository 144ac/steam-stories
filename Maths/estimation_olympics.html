<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Estimation Olympics — STEAM Stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--cream:#FBF3E2;--paper:#FFF9EC;--orange:#DE5715;--orange-dk:#B94409;--ink:#20365C;--sky:#4E9BD6;
    --grass:#6FA83F;--gold:#F5B301;--twine:#A0763B;--red:#D2402E;--plum:#9A5BB5}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;background:var(--cream);color:var(--ink);
    display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
  h1,h2,h3,button,.series,.gametitle,.subject{font-family:'Fredoka','Trebuchet MS','Segoe UI',sans-serif}
  header{background:var(--orange);color:#fff;text-align:center;padding:10px 64px 12px;border-bottom:4px solid var(--orange-dk);
    flex:0 0 auto;position:relative}
  header h1{font-size:clamp(17px,3.4vw,28px);letter-spacing:.05em;font-weight:600;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.18)}
  header p{font-size:clamp(12px,2vw,15px);opacity:.95;margin-top:2px}
  .home{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:var(--paper);color:var(--ink);
    text-decoration:none;font-weight:800;font-size:14px;padding:8px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(0,0,0,.2);
    display:inline-flex;align-items:center;gap:6px;font-family:'Fredoka',sans-serif}
  .home span{font-size:18px}
  #stage{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #status{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--paper);border:3px solid var(--twine);
    border-radius:999px;padding:8px 18px;font-weight:800;font-size:clamp(13px,2.4vw,16px);box-shadow:0 3px 0 rgba(0,0,0,.12);
    white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:5}
  #coach{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;
    padding:9px 16px;font-size:clamp(13px,2.2vw,15px);font-weight:700;max-width:min(520px,92%);text-align:center;display:none;
    box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:15}
  footer{flex:0 0 auto;background:var(--paper);border-top:3px solid #E7D6AE;display:flex;gap:10px;align-items:center;
    justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));flex-wrap:wrap}
  button{font-family:'Fredoka',sans-serif;font-weight:600;border:none;border-radius:16px;padding:12px 20px;
    font-size:clamp(15px,2.6vw,19px);cursor:pointer;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .06s,box-shadow .06s}
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
  button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  .whyBtn{background:var(--gold);color:var(--ink)} .primary{background:var(--orange)} .secondary{background:var(--sky)}
  #hint{width:100%;text-align:center;font-size:clamp(11px,1.9vw,13px);color:#8A7A55;margin-top:2px;line-height:1.5}
  .copy a{color:var(--ink);font-weight:800;text-decoration:underline;text-underline-offset:2px} .copy a.ig{color:#C13584}
  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(32,54,92,.5);padding:18px;z-index:70}
  .overlay .card{background:var(--paper);border:4px solid var(--orange);border-radius:22px;max-width:470px;width:100%;
    padding:20px 22px 18px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-height:88vh;overflow:auto;text-align:center}
  .overlay h2{color:var(--orange);font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:10px}
  .overlay p{font-size:14.5px;line-height:1.5;margin-bottom:10px;text-align:left} .overlay p.center{text-align:center}
  .overlay p b{color:var(--orange)} .overlay button{background:var(--sky);margin:4px auto 0;display:block} .overlay .star{font-size:52px;line-height:1}
  #whyCard{z-index:90}
  #win .cert-cta{background:var(--gold);color:var(--ink);margin-bottom:8px}
  #certCard .card{max-width:560px;padding:14px}
  .cert{background:#FFFDF6;border:6px double var(--orange);border-radius:14px;padding:22px 20px 16px;text-align:center}
  .cert .cbrand{background:var(--ink);color:#fff;letter-spacing:.3em;font-size:11px;font-weight:800;padding:6px 10px;border-radius:6px;display:inline-block}
  .cert .cseries{color:var(--orange);font-family:'Fredoka',sans-serif;font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;margin-top:10px}
  .cert .csubject{color:var(--sky);font-family:'Fredoka',sans-serif;font-weight:700;letter-spacing:.2em;font-size:15px;text-transform:uppercase}
  .cert h3{font-weight:600;color:var(--ink);font-size:21px;margin:14px 0 4px} .cert .small{font-size:13px;color:#7A6C4C}
  .cert .cname{font-family:'Fredoka',sans-serif;font-size:30px;color:var(--orange);font-weight:600;border-bottom:3px solid var(--twine);
    display:inline-block;min-width:60%;padding:2px 12px;margin:6px 0}
  .cert .cach{font-size:14.5px;line-height:1.5;margin:8px 0 12px;text-align:center} .cert .cach b{color:var(--orange)}
  .cert .cstar{font-size:34px} .cert .cfoot{font-size:11.5px;color:#7A6C4C;margin-top:8px;line-height:1.5}
  #certName{width:100%;font:inherit;font-size:17px;padding:11px 14px;border:3px solid var(--twine);border-radius:14px;margin:0 0 10px;
    text-align:center;background:#fff;color:var(--ink)}
  .certBtns{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap} .certBtns button{display:inline-block;margin:0}
  #certSave{background:var(--orange)} #certPrint{background:var(--sky)} #certClose{background:#B5A67F}
  @media print{
    body>*:not(#stage):not(#certCard){display:none!important} #stage>*:not(#certCard){display:none!important}
    #stage{display:block!important;position:static!important}
    #certCard{display:block!important;position:static!important;background:none!important;padding:0!important}
    #certCard .card{border:none!important;box-shadow:none!important;max-width:100%!important;max-height:none!important}
    #certName,.certBtns{display:none!important} .cert{border-width:8px;page-break-inside:avoid}
  }
  #splash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:auto;
    background-color:var(--cream);background-size:cover;background-position:center}
  #splash .brandbar{width:100%;background:var(--ink);color:#fff;padding:9px;font-size:13px;letter-spacing:.3em;font-weight:800;position:relative}
  #splash .brandbar .home{left:10px}
  #splash .inner{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px 22px 14px;gap:4px;width:100%;position:relative}
  #splash .inner::before{content:'';position:absolute;inset:6% 4%;z-index:-1;background:rgba(255,249,236,.78);border-radius:36px;filter:blur(16px)}
  #splash .series{color:var(--orange);font-size:clamp(46px,11vw,86px);line-height:.98;font-weight:700;text-transform:uppercase;text-shadow:0 4px 0 rgba(0,0,0,.08)}
  #splash .subject{color:var(--sky);font-weight:700;font-size:clamp(28px,6.5vw,46px);letter-spacing:.22em;text-transform:uppercase;margin-top:8px;line-height:1}
  #splash .eyebrow{color:var(--twine);font-weight:800;letter-spacing:.16em;font-size:clamp(12px,2.4vw,15px);text-transform:uppercase;margin-top:6px}
  #splash .gametitle{color:var(--ink);font-size:clamp(23px,5vw,34px);font-weight:600;margin-top:10px}
  #splash .cups{font-size:clamp(30px,6vw,46px);margin:4px 0}
  #splash .mission{max-width:460px;font-size:clamp(14px,2.6vw,16.5px);line-height:1.5;margin:4px 0 16px} #splash .mission b{color:var(--orange)}
  #playBtn{background:var(--orange);font-size:clamp(19px,3.6vw,24px);padding:15px 44px;border-radius:20px}
  #splashWhy{background:none;box-shadow:none;color:var(--sky);text-decoration:underline;font-size:14px;padding:10px;margin-top:2px;font-family:'Nunito',sans-serif;font-weight:700}
  #splashWhy:active{transform:none}
  #splash .foot{padding:6px 14px 18px;font-size:12.5px;color:#8A7A55;line-height:1.6;width:100%;background:rgba(255,249,236,.85)}
  #splash .foot a.site{display:inline-block;color:var(--ink);font-weight:800;font-size:14px;text-decoration:underline;text-underline-offset:3px;margin:2px 0 10px}
  .igBtn{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:800;font-size:14px;padding:10px 20px;border-radius:999px;
    background:linear-gradient(45deg,#F58529,#DD2A7B 55%,#8134AF);box-shadow:0 4px 0 rgba(0,0,0,.18);margin:2px auto 8px}
  .igBtn svg{width:17px;height:17px} #splash .fineprint{font-size:11px;margin-top:4px}
  @media (max-height:520px){header p{display:none}}
  
  header{padding:10px 12px 12px 92px}
  #game{position:relative;flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:54px 12px 12px}
  .tally{position:absolute;top:10px;right:10px;background:var(--paper);border:3px solid var(--twine);border-radius:14px;padding:6px 12px;font-weight:900;font-size:15px;z-index:2} .tally b{color:var(--orange);font-size:19px}
  .fb{max-width:560px;background:var(--ink);color:#fff;border-radius:14px;padding:9px 16px;font-weight:700;font-size:clamp(13px,2.3vw,15px);display:none;text-align:center}
  .fb.show{display:block} .fb.ok{background:var(--grass)} .fb.bad{background:var(--red)}
  #mainBtn{display:none}

  .obj{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(17px,3.4vw,22px);background:rgba(255,249,236,.92);border-radius:14px;padding:6px 16px}
  .scene{width:100%;max-width:640px;border:4px solid var(--twine);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.15);background:linear-gradient(#FFF7E3 0 62%,#D9B57A 62%)}
  .scene svg{width:100%;display:block} #ruler{transition:transform .8s} .tick{stroke:#5C4A2A;stroke-width:1} .tk{font-size:6px;fill:#5C4A2A;text-anchor:middle;font-family:Nunito,sans-serif;font-weight:800}
  #needle{transform-origin:200px 150px;transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
  .panel{width:100%;max-width:640px;background:var(--paper);border:3px solid var(--twine);border-radius:16px;padding:10px 14px;text-align:center}
  .panel input{width:100%;max-width:440px} .gv{font-family:'Fredoka',sans-serif;font-weight:700;font-size:26px;color:var(--orange)} .gv small{font-size:14px;color:#8A7A55;font-family:Nunito,sans-serif}
  .table{width:100%;max-width:640px;border-collapse:collapse;font-size:12.5px;font-weight:800;background:rgba(255,255,255,.85);border-radius:12px;overflow:hidden}
  .table th{background:var(--grass);color:#fff;padding:5px} .table td{padding:5px;text-align:center;border-bottom:1px solid #EEE4CC} .table tr.cur td{background:#FFF4CC}
  .res{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(15px,3vw,20px);text-align:center;min-height:24px} .res.good{color:#3F7A1F} .res.bad{color:var(--red)}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center} #goBtn{background:var(--orange)} #levelBtn{background:var(--plum)}
  .chart{display:none;width:100%;max-width:640px;background:var(--paper);border:3px solid var(--gold);border-radius:16px;padding:10px} .chart.show{display:block} .chart h4{font-size:13px;color:#8A7A55;text-align:center;margin-bottom:4px}

</style>
</head>
<body>
<header>
  <a class="home" id="homeBtn" href="index.html"><span>🏠</span><em class="home-txt"></em></a>
  <h1 class="t-header_title"></h1><p class="t-header_sub"></p>
</header>
<div id="stage">
  <div id="game">
    <div id="status"></div>
    <div class="tally"><b id="pts">0</b> <span class="t-pts"></span></div>
    <div class="obj" id="obj"></div>
    <div class="scene"><svg id="svg" viewBox="0 0 400 200"></svg></div>
    <div class="panel"><div class="gv"><span id="gval">15</span> <small id="unit">cm</small></div><input type="range" id="guess" min="1" max="40" value="15"></div>
    <div class="res" id="res"></div>
    <table class="table"><thead><tr><th class="t-my_guess"></th><th class="t-actual"></th><th class="t-how_close"></th></tr></thead><tbody id="tb"></tbody></table>
    <div class="chart" id="chart"><h4 class="t-chart_t"></h4><svg id="csvg" viewBox="0 0 400 120"></svg></div>
    <div class="row"><button id="goBtn"></button><button id="levelBtn" style="display:none"></button><button class="secondary" id="nextBtn" style="display:none"></button></div>
  </div>
  <div id="coach" role="status"></div>
  <div class="overlay" id="win"><div class="card">
    <div class="star">⭐</div><h2 class="t-win_title"></h2><p class="center" id="winBody"></p><p class="t-win_fact"></p>
    <button id="certBtn" class="cert-cta"></button><button id="againBtn"></button>
  </div></div>
  <div class="overlay" id="certCard"><div class="card">
    <input id="certName" type="text" maxlength="28" autocomplete="off">
    <div class="cert">
      <div class="cbrand">D R E A M L A N D</div><div class="cseries">Steam Stories</div><div class="csubject t-subject"></div>
      <h3 class="t-cert_heading"></h3><div class="small t-cert_presented"></div>
      <div class="cname" id="certNameOut">&nbsp;</div><p class="cach t-cert_ach"></p>
      <div class="cstar">⭐ 🏅 ⭐</div><div class="small c-date"></div><div class="cfoot copy"></div>
    </div>
    <div class="certBtns"><button id="certSave"></button><button id="certPrint"></button><button id="certClose"></button></div>
  </div></div>
  <div class="overlay" id="whyCard"><div class="card">
    <h2 class="t-why_title"></h2><p class="t-why_p1"></p><p class="t-why_p2"></p><p class="t-why_p3"></p><p class="t-why_p4"></p>
    <button id="whyClose" class="t-btn_gotit"></button>
  </div></div>
</div>
<footer>
  <button class="primary" id="mainBtn"></button>
  <button class="whyBtn" id="whyBtn"></button>
  <div id="hint" class="copy"></div>
</footer>
<div id="splash">
  <div class="brandbar"><a class="home" href="index.html"><span>🏠</span><em class="home-txt"></em></a>D R E A M L A N D</div>
  <div class="inner">

function chime(good){ try{ const A=ac(),t=A.currentTime; (good?[523,659,784]:[330,262]).forEach((fr,k)=>{const o=A.createOscillator(),g=A.createGain();
  o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.001,t+k*.09);g.gain.linearRampToValueAtTime(.3,t+k*.09+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.3);o.connect(g);g.connect(A.destination);o.start(t+k*.09);o.stop(t+k*.09+.35);}); }catch(_){} }

function strip(h){ return h.replace(/<[^>]+>/g,''); }
function wrapText(x,txt,cx,y,maxW,lh){ const words=txt.split(' '); let line=''; for(const w of words){ const t=line?line+' '+w:w;
  if(x.measureText(t).width>maxW&&line){ x.fillText(line,cx,y); y+=lh; line=w; } else line=t; } if(line) x.fillText(line,cx,y); return y; }
function rrect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
async function saveCertImage(){
  const W=1200,H=880,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const FD="Fredoka,'Trebuchet MS',sans-serif", FN="Nunito,'Trebuchet MS',sans-serif";
  x.fillStyle='#FFFDF6'; x.fillRect(0,0,W,H);
  x.strokeStyle='#DE5715'; x.lineWidth=10; x.strokeRect(24,24,W-48,H-48); x.lineWidth=3; x.strokeRect(46,46,W-92,H-92);
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#20365C'; rrect(x,W/2-140,78,280,46,10); x.fill();
  x.fillStyle='#fff'; x.font='800 20px '+FN; x.fillText('D R E A M L A N D',W/2,110);
  x.fillStyle='#DE5715'; x.font='700 76px '+FD; x.fillText('STEAM STORIES',W/2,205);
  x.fillStyle='#4E9BD6'; x.font='700 34px '+FD; x.fillText(L.subject.toUpperCase().split('').join(' '),W/2,250);
  x.fillStyle='#20365C'; x.font='600 44px '+FD; x.fillText(L.cert_heading,W/2,325);
  x.fillStyle='#7A6C4C'; x.font='600 24px '+FN; x.fillText(L.cert_presented,W/2,366);
  x.fillStyle='#DE5715'; x.font='600 64px '+FD; x.fillText(certName.value.trim()||'________',W/2,444);
  x.strokeStyle='#A0763B'; x.lineWidth=4; x.beginPath(); x.moveTo(W/2-280,462); x.lineTo(W/2+280,462); x.stroke();
  x.fillStyle='#20365C'; x.font='600 28px '+FN; const yEnd=wrapText(x,strip(L.cert_ach),W/2,522,920,40);
  x.font='58px '+FN; x.fillText('⭐ 🏅 ⭐',W/2,yEnd+88);
  x.fillStyle='#7A6C4C'; x.font='600 22px '+FN; x.fillText(dateStr,W/2,yEnd+140);
  x.font='600 17px '+FN; x.fillText(strip(L.copy)+' · www.dreamlandpublications.com · instagram.com/dreamland.publications',W/2,H-62);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const file=new File([blob],'STEAM-Stories-Certificate.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'STEAM Stories'}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob);
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){ window.open(url,'_blank'); coachSay(L.cert_ios_hint); }
  else { const a=document.createElement('a'); a.href=url; a.download='STEAM-Stories-Certificate.png'; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),6000);
}

function score(off,actual){const r=off/actual;return r<=0.05?10:r<=0.15?7:r<=0.3?4:1;}
goBtn.addEventListener('click',()=>{if(locked)return;locked=true;const o=OBJ[i],g=+guess.value,a=level==='cm'?o.cm:o.g,off=Math.abs(g-a),p=score(off,a);pts+=p;ptsEl.textContent=pts;
  draw(true);if(level==='cm'){const r=svg.querySelector('#ruler');r.setAttribute('opacity',1);}
  const tag=p===10?L.gold:p===7?L.silver:p===4?L.bronze:L.far;res.textContent=tag+' '+L.off.replace('{n}',off+' '+(level==='cm'?'cm':'g'))+' · +'+p;res.className='res '+(p>=4?'good':'bad');chime(p>=4);
  log.push({g,a,off,p});const tr=document.createElement('tr');tr.className='cur';tr.innerHTML='<td>'+o.e+' '+g+' '+(level==='cm'?'cm':'g')+'</td><td>'+a+' '+(level==='cm'?'cm':'g')+'</td><td>'+L.off.replace('{n}',off)+' · +'+p+'</td>';tb.querySelectorAll('tr').forEach(x=>x.classList.remove('cur'));tb.appendChild(tr);
  if(log.length===1)coachSay(L.tip);goBtn.style.display='none';
  if(i<OBJ.length-1)nextBtn.style.display='';else if(level==='cm')levelBtn.style.display='';else finish();});
nextBtn.addEventListener('click',()=>{i++;setup();});
levelBtn.addEventListener('click',()=>{level='g';i=0;setup();});
function finish(){setStatus(L.status_done);chart.className='chart show';const c=document.getElementById('csvg');c.innerHTML='';const rel=log.map(x=>Math.min(1,x.off/x.a));
  c.appendChild(E('line',{x1:30,y1:100,x2:390,y2:100,stroke:'#8A7A55'}));c.appendChild(E('line',{x1:30,y1:10,x2:30,y2:100,stroke:'#8A7A55'}));
  let d='';rel.forEach((v,k)=>{const x=40+k*38,y=100-v*85;d+=(k?'L':'M')+x+' '+y+' ';c.appendChild(E('circle',{cx:x,cy:y,r:4,fill:'#DE5715'}));c.appendChild(E('text',{x:x,y:112,class:'tk'},k+1));});
  c.appendChild(E('path',{d,fill:'none',stroke:'#DE5715','stroke-width':2.5}));c.appendChild(E('text',{x:34,y:12,class:'tk','text-anchor':'start'},L.off.replace('{n}','')));
  document.getElementById('winBody').textContent=L.win_body.replace('{p}',pts).replace('{f}',log[0].off+' cm').replace('{l}',log[log.length-1].off+' g');setTimeout(showWin,1200);}
function startGame(){resetGame();coachSay(L.coach_start);}
function resetGame(){level='cm';i=0;pts=0;log=[];ptsEl.textContent=0;tb.innerHTML='';chart.className='chart';setup();}
resetGame();

})();
</script>
