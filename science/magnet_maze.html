</head>

let AC=null; function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function chime(good){ try{ const A=ac(),t=A.currentTime; (good?[523,659,784]:[330,262]).forEach((fr,k)=>{const o=A.createOscillator(),g=A.createGain();
  o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.001,t+k*.09);g.gain.linearRampToValueAtTime(.3,t+k*.09+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.3);o.connect(g);g.connect(A.destination);o.start(t+k*.09);o.stop(t+k*.09+.35);}); }catch(_){} }
function markDone(){ try{ localStorage.setItem('ss_sci_'+GAMEKEY,'1'); }catch(_){} }

function strip(h){ return h.replace(/<[^>]+>/g,''); }
function wrapText(x,txt,cx,y,maxW,lh){ const words=txt.split(' '); let line=''; for(const w of words){ const t=line?line+' '+w:w;
  if(x.measureText(t).width>maxW&&line){ x.fillText(line,cx,y); y+=lh; line=w; } else line=t; } if(line) x.fillText(line,cx,y); return y; }
function rrect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
async function saveCertImage(){
  const W=1200,H=880,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const FD="Fredoka,'Trebuchet MS',sans-serif", FN="Nunito,'Trebuchet MS',sans-serif";
  x.fillStyle='#FFFDF6'; x.fillRect(0,0,W,H);
  x.strokeStyle='#DE5715'; x.lineWidth=10; x.strokeRect(24,24,W-48,H-48); x.lineWidth=3; x.strokeRect(46,46,W-92,H-92);
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#20365C'; rrect(x,W/2-140,78,280,46,10); x.fill();
  x.fillStyle='#fff'; x.font='800 20px '+FN; x.fillText('D R E A M L A N D',W/2,110);
  x.fillStyle='#DE5715'; x.font='700 76px '+FD; x.fillText('STEAM STORIES',W/2,205);
  x.fillStyle='#4E9BD6'; x.font='700 34px '+FD; x.fillText(L.subject.toUpperCase().split('').join(' '),W/2,250);
  x.fillStyle='#20365C'; x.font='600 44px '+FD; x.fillText(L.cert_heading,W/2,325);
  x.fillStyle='#7A6C4C'; x.font='600 24px '+FN; x.fillText(L.cert_presented,W/2,366);
  x.fillStyle='#DE5715'; x.font='600 64px '+FD; x.fillText(certName.value.trim()||'________',W/2,444);
  x.strokeStyle='#A0763B'; x.lineWidth=4; x.beginPath(); x.moveTo(W/2-280,462); x.lineTo(W/2+280,462); x.stroke();
  x.fillStyle='#20365C'; x.font='600 28px '+FN; const yEnd=wrapText(x,strip(L.cert_ach),W/2,522,920,40);
  x.font='58px '+FN; x.fillText('⭐ 🏅 ⭐',W/2,yEnd+88);
  x.fillStyle='#7A6C4C'; x.font='600 22px '+FN; x.fillText(dateStr,W/2,yEnd+140);
  x.font='600 17px '+FN; x.fillText(strip(L.copy)+' · www.dreamlandpublications.com · instagram.com/dreamland.publications',W/2,H-62);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const file=new File([blob],'STEAM-Stories-Certificate.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'STEAM Stories'}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob);
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){ window.open(url,'_blank'); coachSay(L.cert_ios_hint); }
  else { const a=document.createElement('a'); a.href=url; a.download='STEAM-Stories-Certificate.png'; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),6000);
}

function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=cv.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);layout();}
addEventListener('resize',resize);
function layout(){cell=Math.min((W*0.92)/cols,(H*0.80)/rows);ox=(W-cols*cell)/2;oy=(H-rows*cell)/2+H*0.04;}
function loadLevel(n){level=n;maze=MAZES[n];rows=maze.length;cols=maze[0].length;layout();
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const ch=maze[r][c];if(ch==='S'){clip={x:c+.5,y:r+.5,vx:0,vy:0};}if(ch==='K')keyPos={x:c+.5,y:r+.5};}
  lvlEl.innerHTML=L.lvl+' <b>'+(n+1)+'</b>/3'; setStatus(L.status_play);}
function wall(cx,cy){const c=Math.floor(cx),r=Math.floor(cy);if(r<0||c<0||r>=rows||c>=cols)return true;return maze[r][c]==='#';}
function blocked(x,y){const R=.28;return wall(x-R,y-R)||wall(x+R,y-R)||wall(x-R,y+R)||wall(x+R,y+R);}
function toCell(px,py){return{x:(px-ox)/cell,y:(py-oy)/cell};}
function pt(e){const r=cv.getBoundingClientRect();const p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top};}
function setMag(e){const p=pt(e);mag=toCell(p.x,p.y);}
cv.addEventListener('mousemove',setMag);cv.addEventListener('mousedown',setMag);
cv.addEventListener('touchstart',e=>{setMag(e);e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{setMag(e);e.preventDefault();},{passive:false});
addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){keys[e.key]=true;e.preventDefault();if(mag.x<-100)mag={x:clip.x,y:clip.y-1.2};}});
addEventListener('keyup',e=>{keys[e.key]=false;});
const RANGE=3.0;
function step(dt){
  if(!active)return;
  const ks=6*dt;if(keys.ArrowLeft)mag.x-=ks;if(keys.ArrowRight)mag.x+=ks;if(keys.ArrowUp)mag.y-=ks;if(keys.ArrowDown)mag.y+=ks;
  const dx=mag.x-clip.x,dy=mag.y-clip.y,d=Math.hypot(dx,dy);
  if(d<RANGE&&d>0.05){const f=Math.pow(1-d/RANGE,1.6)*38;clip.vx+=dx/d*f*dt;clip.vy+=dy/d*f*dt;farTimer=0;}
  else if(mag.x>-100){farTimer+=dt;if(farTimer>2.2){coachSay(L.coach_far);farTimer=-6;}}
  clip.vx*=Math.pow(0.02,dt);clip.vy*=Math.pow(0.02,dt);
  const sp=Math.hypot(clip.vx,clip.vy),max=5.5;if(sp>max){clip.vx*=max/sp;clip.vy*=max/sp;}
  let nx=clip.x+clip.vx*dt;if(!blocked(nx,clip.y))clip.x=nx;else clip.vx=0;
  let ny=clip.y+clip.vy*dt;if(!blocked(clip.x,ny))clip.y=ny;else clip.vy=0;
  if(Math.hypot(clip.x-keyPos.x,clip.y-keyPos.y)<.55){active=false;chime(true);
    if(level<2){coachSay(L.coach_next);setTimeout(()=>{loadLevel(level+1);active=true;},1500);}else showWin();}
}
let last=0;
function frame(now){const dt=Math.min(.05,(now-last)/1000||.016);last=now;step(dt);
  ctx.clearRect(0,0,W,H);
  if(bgImg.complete){const s=Math.max(W/bgImg.width,H/bgImg.height);ctx.drawImage(bgImg,(W-bgImg.width*s)/2,(H-bgImg.height*s)/2,bgImg.width*s,bgImg.height*s);}
  ctx.fillStyle='rgba(60,35,15,.35)';ctx.fillRect(0,0,W,H);
  // board
  ctx.fillStyle='#E9D7B0';ctx.fillRect(ox-6,oy-6,cols*cell+12,rows*cell+12);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const X=ox+c*cell,Y=oy+r*cell;
    if(maze[r][c]==='#'){ctx.fillStyle='#8B5A2B';ctx.fillRect(X,Y,cell,cell);ctx.fillStyle='#A66E3A';ctx.fillRect(X+2,Y+2,cell-4,cell*.45-2);}
    else{ctx.fillStyle=((r+c)%2)?'#F6EBD0':'#FBF3E2';ctx.fillRect(X,Y,cell,cell);}}
  ctx.font=(cell*.75)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('🗝️',ox+keyPos.x*cell,oy+keyPos.y*cell);
  // magnet field
  const mx=ox+mag.x*cell,my=oy+mag.y*cell;
  if(mag.x>-100){const d=Math.hypot(mag.x-clip.x,mag.y-clip.y);ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle=d<RANGE?'rgba(222,87,21,.55)':'rgba(120,120,120,.35)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(mx,my,RANGE*cell,0,7);ctx.stroke();ctx.restore();
    if(d<RANGE){ctx.strokeStyle='rgba(78,155,214,.7)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(ox+clip.x*cell,oy+clip.y*cell);ctx.lineTo(mx,my);ctx.stroke();}}
  const ang=Math.atan2(mag.y-clip.y,mag.x-clip.x);
  ctx.save();ctx.translate(ox+clip.x*cell,oy+clip.y*cell);ctx.rotate(ang+Math.PI/4);ctx.font=(cell*.7)+'px sans-serif';ctx.fillText('📎',0,0);ctx.restore();
  if(mag.x>-100){ctx.font=(cell*.9)+'px sans-serif';ctx.fillText('🧲',mx,my);}
  requestAnimationFrame(frame);}
function startGame(){resize();loadLevel(0);active=true;coachSay(L.coach_start);}
function resetGame(){loadLevel(0);active=true;}
document.getElementById('resetBtn').textContent=L.btn_reset;
document.getElementById('resetBtn').addEventListener('click',()=>{loadLevel(level);active=true;});
loadLevel(0);resize();requestAnimationFrame(frame);

})();
</script>
