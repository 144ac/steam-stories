  q4:"दो एक जैसे अंकुर: एक धूप में, एक अँधेरे डिब्बे में, एक हफ़्ता। कौन ज़्यादा लंबा?", q4a:"धूप वाला", q4b:"अँधेरे वाला", q4c:"बिल्कुल बराबर",
  e4:"हैरानी! अँधेरे वाला ज़्यादा लंबा — वह रोशनी पाने के लिए बेतहाशा खिंचता है। पर पीला, पतला और कमज़ोर।",
  q5:"एक पौधा खिड़की की ओर झुका है। तुम गमला घुमा देते हो। अब क्या होगा?", q5a:"पुरानी ओर ही झुका रहेगा", q5b:"धीरे-धीरे फिर खिड़की की ओर मुड़ेगा", q5c:"बढ़ना बंद कर देगा",
  e5:"एक-दो दिन में तना फिर खिड़की की ओर मुड़ जाता है। पौधे रोशनी का पीछा करते रहते हैं।",
  q6:"पौधे रोशनी के पीछे इतना क्यों भागते हैं?", q6a:"गर्म रहने के लिए", q6b:"अपना खाना बनाने के लिए", q6c:"सुंदर दिखने के लिए",
  e6:"पत्तियाँ सूरज की रोशनी से हवा और पानी को शक्कर में बदलती हैं — यही प्रकाश-संश्लेषण है। रोशनी नहीं, खाना नहीं!",
  win_title:"पौधों के वैज्ञानिक!", win_body:"छह अनुमान, छह खोजें। अब तुम जानते हो कि कहानी की सेम उस डिब्बे में असल में क्या कर रही थी।",
  win_fact:"<b>पौधे की बात:</b> पौधे के रोशनी की ओर बढ़ने को <b>फ़ोटोट्रॉपिज़्म</b> कहते हैं। सूरजमुखी इसमें इतने माहिर हैं कि कम उम्र के पौधे हर दिन आकाश में सूरज के साथ-साथ मुड़ते हैं!",
  why_title:"पौधों को रोशनी क्यों चाहिए?",
  why_p1:"पौधे की पत्तियाँ छोटी-छोटी खाने की फ़ैक्ट्रियाँ हैं। <b>सूरज की रोशनी</b> से वे हवा और पानी को शक्कर में बदलती हैं — इसे <b>प्रकाश-संश्लेषण</b> कहते हैं।",
  why_p2:"रोशनी नहीं तो खाना नहीं। इसलिए पौधा उजाले तक पहुँचने के लिए सब कुछ करता है: झुकना, खिंचना और उसकी ओर बढ़ना।",
  why_p3:"अँधेरे में अंकुर बहुत तेज़ी से लंबा और पतला बढ़ता है, अपनी जमा ऊर्जा खोज में लगाता है। वह <b>पीला</b> रहता है क्योंकि हरे क्लोरोफ़िल को बनने के लिए रोशनी चाहिए।",
  why_p4:"रोशनी मिलते ही पत्तियाँ हरी हो जाती हैं, तना मज़बूत होता है और पौधा खुद खाना बनाने लगता है — ठीक वैसे जैसे कहानी की सेम डिब्बे से बाहर निकलने पर।",

});
document.querySelectorAll('.home-txt').forEach(e=>e.textContent=L.home);
document.querySelectorAll('.home').forEach(a=>{ if(LCODE!=='en') a.href='index.html?lang='+LCODE; });
document.getElementById('playBtn').textContent=L.btn_play; document.getElementById('whyBtn').textContent=L.btn_why;

const COPY=L.copy+' · <a href="https://www.dreamlandpublications.com" target="_blank" rel="noopener">www.dreamlandpublications.com</a> · <a class="ig" href="https://www.instagram.com/dreamland.publications/" target="_blank" rel="noopener">'+L.ig_short+'</a>';

/* shell helpers */
const coach=document.getElementById('coach'); let coachTimer=null;
function coachSay(m){clearTimeout(coachTimer);coach.textContent=m;coach.style.display='block';coachTimer=setTimeout(()=>coach.style.display='none',3800);}
const statusEl=document.getElementById('status');
function setStatus(t){ if(statusEl) statusEl.textContent=t; }
let AC=null; function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function chime(good){ try{ const A=ac(),t=A.currentTime; (good?[523,659,784]:[330,262]).forEach((fr,k)=>{const o=A.createOscillator(),g=A.createGain();
  o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.001,t+k*.09);g.gain.linearRampToValueAtTime(.3,t+k*.09+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.3);o.connect(g);g.connect(A.destination);o.start(t+k*.09);o.stop(t+k*.09+.35);}); }catch(_){} }
function markDone(){ try{ localStorage.setItem('ss_sci_'+GAMEKEY,'1'); }catch(_){} }
function showWin(){ markDone(); chime(true); setTimeout(()=>{document.getElementById('win').style.display='flex';},700); }
document.addEventListener('pointerdown',()=>{try{ac();}catch(_){}},{once:true});
window.addEventListener('error',e=>setStatus('⚠️ '+(e.message||'error')));

/* certificate */
const certCard=document.getElementById('certCard'), certName=document.getElementById('certName'), certNameOut=document.getElementById('certNameOut');
document.getElementById('certBtn').addEventListener('click',()=>{certCard.style.display='flex';certName.focus();});
document.getElementById('certClose').addEventListener('click',()=>certCard.style.display='none');
document.getElementById('certPrint').addEventListener('click',()=>window.print());
certName.addEventListener('input',()=>{certNameOut.textContent=certName.value.trim()||'\u00a0';});
function strip(h){ return h.replace(/<[^>]+>/g,''); }
function wrapText(x,txt,cx,y,maxW,lh){ const words=txt.split(' '); let line=''; for(const w of words){ const t=line?line+' '+w:w;
  if(x.measureText(t).width>maxW&&line){ x.fillText(line,cx,y); y+=lh; line=w; } else line=t; } if(line) x.fillText(line,cx,y); return y; }
function rrect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }
async function saveCertImage(){
  const W=1200,H=880,c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const FD="Fredoka,'Trebuchet MS',sans-serif", FN="Nunito,'Trebuchet MS',sans-serif";
  x.fillStyle='#FFFDF6'; x.fillRect(0,0,W,H);
  x.strokeStyle='#DE5715'; x.lineWidth=10; x.strokeRect(24,24,W-48,H-48); x.lineWidth=3; x.strokeRect(46,46,W-92,H-92);
  x.textAlign='center'; x.textBaseline='alphabetic';
  x.fillStyle='#20365C'; rrect(x,W/2-140,78,280,46,10); x.fill();
  x.fillStyle='#fff'; x.font='800 20px '+FN; x.fillText('D R E A M L A N D',W/2,110);
  x.fillStyle='#DE5715'; x.font='700 76px '+FD; x.fillText('STEAM STORIES',W/2,205);
  x.fillStyle='#4E9BD6'; x.font='700 34px '+FD; x.fillText(L.subject.toUpperCase().split('').join(' '),W/2,250);
  x.fillStyle='#20365C'; x.font='600 44px '+FD; x.fillText(L.cert_heading,W/2,325);
  x.fillStyle='#7A6C4C'; x.font='600 24px '+FN; x.fillText(L.cert_presented,W/2,366);
  x.fillStyle='#DE5715'; x.font='600 64px '+FD; x.fillText(certName.value.trim()||'________',W/2,444);
  x.strokeStyle='#A0763B'; x.lineWidth=4; x.beginPath(); x.moveTo(W/2-280,462); x.lineTo(W/2+280,462); x.stroke();
  x.fillStyle='#20365C'; x.font='600 28px '+FN; const yEnd=wrapText(x,strip(L.cert_ach),W/2,522,920,40);
  x.font='58px '+FN; x.fillText('⭐ 🏅 ⭐',W/2,yEnd+88);
  x.fillStyle='#7A6C4C'; x.font='600 22px '+FN; x.fillText(dateStr,W/2,yEnd+140);
  x.font='600 17px '+FN; x.fillText(strip(L.copy)+' · www.dreamlandpublications.com · instagram.com/dreamland.publications',W/2,H-62);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const file=new File([blob],'STEAM-Stories-Certificate.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'STEAM Stories'}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob);
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){ window.open(url,'_blank'); coachSay(L.cert_ios_hint); }
  else { const a=document.createElement('a'); a.href=url; a.download='STEAM-Stories-Certificate.png'; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),6000);
}
document.getElementById('certSave').addEventListener('click',saveCertImage);
const whyCard=document.getElementById('whyCard');
document.getElementById('whyBtn').addEventListener('click',()=>whyCard.style.display='flex');
document.getElementById('splashWhy').addEventListener('click',()=>whyCard.style.display='flex');
document.getElementById('whyClose').addEventListener('click',()=>whyCard.style.display='none');
whyCard.addEventListener('click',e=>{if(e.target===whyCard)whyCard.style.display='none';});
document.getElementById('againBtn').addEventListener('click',()=>{document.getElementById('win').style.display='none'; resetGame();});
document.getElementById('playBtn').addEventListener('click',()=>{document.getElementById('splash').style.display='none'; startGame();});

/* ============ GAME ============ */

const ROUNDS=[
 {s:'☀️ ➡️ 🌱',a:0},{s:'🚪🌑🌱',a:1},{s:'📦🕳️<br>🌱',a:0},{s:'☀️🌿 | 🌑🌾',a:1},{s:'🌞 🌱 🔄',a:1},{s:'☀️🌻❔',a:1}];
const quiz=document.getElementById('quiz'),sceneEl=document.getElementById('qscene'),qEl=document.getElementById('qtext'),
  opts=document.getElementById('opts'),fb=document.getElementById('fb'),scoreEl=document.getElementById('score'),nextBtn=document.getElementById('nextBtn');
quiz.style.backgroundImage='url("'+ASSETS.bg+'")';nextBtn.textContent=L.btn_next;
let i=0,score=0,locked=false;
function show(){const r=ROUNDS[i];sceneEl.innerHTML=r.s;qEl.textContent=L['q'+(i+1)];opts.innerHTML='';fb.className='fb';locked=false;nextBtn.style.display='none';
  ['a','b','c'].forEach((k,n)=>{const b=document.createElement('button');b.textContent=(n+1)+'. '+L['q'+(i+1)+k];b.addEventListener('click',()=>pick(n));opts.appendChild(b);});
  setStatus(L.status_q+' '+(i+1)+' / '+ROUNDS.length);}
function pick(n){if(locked)return;locked=true;const r=ROUNDS[i];const right=n===r.a;if(right)score++;scoreEl.textContent=score;chime(right);
  [...opts.children].forEach((b,k)=>{if(k===r.a)b.classList.add('right');else if(k===n)b.classList.add('wrong');b.disabled=true;});
  fb.textContent=(right?L.ok:L.bad)+' '+L['e'+(i+1)];fb.className='fb show '+(right?'ok':'bad');nextBtn.style.display='';}
nextBtn.addEventListener('click',()=>{i++;if(i>=ROUNDS.length){setStatus(L.status_done);showWin();}else show();});
addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key)&&!locked)pick(+e.key-1);if(e.key==='Enter'&&locked)nextBtn.click();});
function startGame(){resetGame();coachSay(L.coach_start);}
function resetGame(){i=0;score=0;scoreEl.textContent='0';show();}
resetGame();

})();
