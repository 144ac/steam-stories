/* shell helpers */
const coach=document.getElementById('coach'); let coachTimer=null;
function coachSay(m){clearTimeout(coachTimer);coach.textContent=m;coach.style.display='block';coachTimer=setTimeout(()=>coach.style.display='none',3800);}
const statusEl=document.getElementById('status');
function setStatus(t){ if(statusEl) statusEl.textContent=t; }
let AC=null; function ac(){ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); return AC; }
function chime(good){ try{ const A=ac(),t=A.currentTime; (good?[523,659,784]:[330,262]).forEach((fr,k)=>{const o=A.createOscillator(),g=A.createGain();
  o.type='triangle';o.frequency.value=fr;g.gain.setValueAtTime(.001,t+k*.09);g.gain.linearRampToValueAtTime(.3,t+k*.09+.02);
  g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.3);o.connect(g);g.connect(A.destination);o.start(t+k*.09);o.stop(t+k*.09+.35);}); }catch(_){} }
function markDone(){ try{ localStorage.setItem('ss_tech_'+GAMEKEY,'1'); }catch(_){} }
function showWin(){ markDone(); chime(true); setTimeout(()=>{document.getElementById('win').style.display='flex';},700); }
document.addEventListener('pointerdown',()=>{try{ac();}catch(_){}},{once:true});
window.addEventListener('error',e=>setStatus('⚠️ '+(e.message||'error')));

function strip(h){ return h.replace(/<[^>]+>/g,''); }
function wrapText(x,txt,cx,y,maxW,lh){ const words=txt.split(' '); let line=''; for(const w of words){ const t=line?line+' '+w:w;
  if(x.measureText(t).width>maxW&&line){ x.fillText(line,cx,y); y+=lh; line=w; } else line=t; } if(line) x.fillText(line,cx,y); return y; }
function rrect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }

  x.font='58px '+FN; x.fillText('⭐ 🏅 ⭐',W/2,yEnd+88);
  x.fillStyle='#7A6C4C'; x.font='600 22px '+FN; x.fillText(dateStr,W/2,yEnd+140);
  x.font='600 17px '+FN; x.fillText(strip(L.copy)+' · www.dreamlandpublications.com · instagram.com/dreamland.publications',W/2,H-62);
  const blob=await new Promise(r=>c.toBlob(r,'image/png')); const file=new File([blob],'STEAM-Stories-Certificate.png',{type:'image/png'});
  if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:'STEAM Stories'}); return; }catch(e){ if(e.name==='AbortError') return; } }
  const url=URL.createObjectURL(blob);
  if(/iPhone|iPad|iPod/i.test(navigator.userAgent)){ window.open(url,'_blank'); coachSay(L.cert_ios_hint); }
  else { const a=document.createElement('a'); a.href=url; a.download='STEAM-Stories-Certificate.png'; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(()=>URL.revokeObjectURL(url),6000);
}
document.getElementById('certSave').addEventListener('click',saveCertImage);
const whyCard=document.getElementById('whyCard');
document.getElementById('whyBtn').addEventListener('click',()=>whyCard.style.display='flex');
document.getElementById('splashWhy').addEventListener('click',()=>whyCard.style.display='flex');
document.getElementById('whyClose').addEventListener('click',()=>whyCard.style.display='none');
whyCard.addEventListener('click',e=>{if(e.target===whyCard)whyCard.style.display='none';});
document.getElementById('againBtn').addEventListener('click',()=>{document.getElementById('win').style.display='none'; resetGame();});
document.getElementById('playBtn').addEventListener('click',()=>{document.getElementById('splash').style.display='none'; startGame();});
/* ============ GAME ============ */
const CMDS=[['c1','🎵','#4E9BD6','act_music'],['c2','🔊','#E8A020','act_loud'],['c3','⏸','#9A5BB5','act_pause'],['c4','⏹','#D2402E','act_stop'],['c5','🎤','#6FA83F','act_joke']];
/* m = index of matched command or -1; st = speaking style */
const ROUNDS=[{m:0},{m:-1},{m:1,st:'whisper'},{m:-1},{m:4,st:'funny'},{m:-1,st:'mumble'},{m:3},{m:-1},{m:1,st:'shout'},{m:-1}];
const NEED=8;
const list=document.getElementById('list'),bubble=document.getElementById('bubble'),styleEl=document.getElementById('style'),spk=document.getElementById('spk'),reply=document.getElementById('reply'),
  fb=document.getElementById('fb'),scoreEl=document.getElementById('score'),nextBtn=document.getElementById('nextBtn'),bM=document.getElementById('btnMatch'),bN=document.getElementById('btnNo'),kid=document.getElementById('kid');
const KIDS=['🧒','👧','👦','👩','👨','🧑'];
nextBtn.textContent=L.btn_next;bM.textContent=L.btn_match;bN.textContent=L.btn_nomatch;
CMDS.forEach(c=>{const li=document.createElement('li');li.innerHTML='<span class="ico" style="background:'+c[2]+'">'+c[1]+'</span>'+L[c[0]];list.appendChild(li);});
let i=0,score=0,locked=false;
function show(){const r=ROUNDS[i];locked=false;fb.className='fb';nextBtn.style.display='none';spk.classList.remove('on');reply.textContent='';
  bM.classList.remove('dim');bN.classList.remove('dim');[...list.children].forEach(l=>l.classList.remove('hit'));
  kid.textContent=KIDS[i%KIDS.length];
  const t=L['p'+(i+1)];bubble.className='bubble'+(r.st?' '+r.st:'');bubble.innerHTML=r.st==='funny'?t.split('').map((ch,k)=>(ch!==' '&&k%3==1)?'<b>'+ch+'</b>':ch).join(''):t;
  styleEl.textContent=r.st?L['style_'+r.st]:'';setStatus(L.status_q+' '+(i+1)+' / '+ROUNDS.length);}
function pick(saidMatch){if(locked)return;locked=true;const r=ROUNDS[i],isMatch=r.m>=0,right=saidMatch===isMatch;
  if(right)score++;scoreEl.textContent=score;chime(right);(saidMatch?bN:bM).classList.add('dim');
  if(isMatch){spk.classList.add('on');reply.textContent=L[CMDS[r.m][3]];list.children[r.m].classList.add('hit');} else reply.textContent=L.act_silent;
  fb.textContent=(right?L.ok:L.bad)+' '+L['e'+(i+1)];fb.className='fb show '+(right?'ok':'bad');nextBtn.style.display='';}
bM.addEventListener('click',()=>pick(true));bN.addEventListener('click',()=>pick(false));
nextBtn.addEventListener('click',()=>{i++;if(i>=ROUNDS.length){setStatus(L.status_done);
  if(score>=NEED){document.getElementById('winBody').textContent=L.win_body.replace('{s}',score).replace('{n}',ROUNDS.length);showWin();}
  else{document.getElementById('loseBody').textContent=L.lose_body.replace('{s}',score).replace('{n}',ROUNDS.length).replace('{need}',NEED);chime(false);setTimeout(()=>document.getElementById('lose').style.display='flex',500);}
  }else show();});
document.getElementById('loseAgain').textContent=L.btn_again;
document.getElementById('loseAgain').addEventListener('click',()=>{document.getElementById('lose').style.display='none';resetGame();});
addEventListener('keydown',e=>{if(e.key==='1')pick(true);if(e.key==='2')pick(false);if(e.key==='Enter'&&locked)nextBtn.click();});
function startGame(){resetGame();coachSay(L.coach_start);}
function resetGame(){i=0;score=0;scoreEl.textContent='0';show();}
resetGame();

})();
</script>
